# =============================================================================
# Workflow metadata
# =============================================================================
# Terraform infrastructure pipeline: init -> validate -> plan -> approval -> apply.
#
#   init      checkout, AWS identity check, Terraform setup, backend initialisation
#   validate  terraform fmt -check, terraform validate (no AWS credentials needed)
#   plan      terraform plan -out=tfplan, read-only preflight for already-existing
#             resources, saved plan uploaded as an artifact (1-day retention)
#   apply     runs in the `production` environment: GitHub holds the job until a
#             required reviewer approves, BEFORE any apply step runs. Downloads the
#             EXACT saved plan, verifies its SHA-256, applies it (no new plan), then
#             prints the Terraform outputs.
#
# SECURITY NOTE: the plan artifact is NOT encrypted. A saved Terraform plan can contain
# sensitive values in plain text, and anyone who can read this repository's Actions
# artifacts can download it during its 1-day retention. Keep the repository private and
# limit who has read access. The SHA-256 check only detects tampering; it does not hide
# the contents.
#
# Each job runs on a fresh GitHub-hosted runner, so every job that needs Terraform
# checks out the code, installs Terraform and initialises on its own. Nothing is
# shared between jobs except job outputs and the saved plan artifact.
#
# Only `workflow_dispatch`: nothing here runs on push or pull_request.
# Setup (secrets, variables, GitHub Environment): see docs/OPERATIONS.md "Terraform workflow".
#
# NO RESOURCE-TYPE ALLOW-LIST: the plan job no longer filters the plan by resource type, so
# any plan with changes is uploaded and offered for approval. What CI can actually
# change is limited only by the IAM permissions of the CI identity (an apply that needs a
# permission it lacks fails partway). The human review of the plan in the `production`
# approval is the control that decides what is applied.
#
# Remaining automatic checks:
#   * plan job:  read-only preflight; fails if a resource the plan would create already
#                exists in AWS (it never imports and never touches Terraform state).
#   * apply job: re-checks the saved plan right before apply and REFUSES it if it
#                deletes or replaces any resource. (There is no EKS cluster-admin check: the
#                CI identity that creates the cluster becomes its Kubernetes cluster-admin
#                through bootstrap_cluster_creator_admin_permissions = true; see docs.)
#
# The approval gate exists only once Required reviewers are configured on the
# `production` environment (Settings -> Environments); this file cannot enforce that.
name: infra Terraform

on:
  workflow_dispatch:

# =============================================================================
# Permissions
# =============================================================================
# Least privilege by default; no job needs more than read access to the repo.
permissions:
  contents: read

# =============================================================================
# Concurrency
# =============================================================================
# One infrastructure run at a time. Runs are queued, never cancelled: cancelling
# while a plan is waiting for approval or an apply is running could leave state half-changed.
concurrency:
  group: terraform-infra
  cancel-in-progress: false

# =============================================================================
# Global environment variables
# =============================================================================
env:
  TF_WORKING_DIR: terraform # verified: this repo's Terraform lives in ./terraform (there is no EKS-Terraform folder)
  TF_VERSION: "1.16.2" # exact version: every job, and plan and apply in particular, must use the same Terraform binary
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Existing state bucket, created manually in the AWS Console. It must match terraform/backend.tf
  # (the backend reads its bucket from there, so `terraform init` needs no extra arguments).
  TF_VAR_tfstate_bucket_name: moh-terraform-state-2026-uniq
  # Non-secret configuration (repository variable, not a secret). tfvars files are not committed.
  TF_VAR_public_access_cidrs: ${{ vars.PUBLIC_ACCESS_CIDRS }} # JSON list, e.g. ["203.0.113.10/32"]; never 0.0.0.0/0

jobs:
  # ===========================================================================
  # Job 1: init
  # Proves, on its own runner, that the commit, the AWS credentials and the S3
  # backend are usable before anything else runs. Nothing from this job's
  # working directory is reused later; it only publishes the commit SHA.
  # ===========================================================================
  init:
    name: 1 - Terraform Init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify workflow commit SHA
        id: commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::checked-out commit ($sha) is not the workflow commit ($GITHUB_SHA)"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        # Prints only the caller ARN, never credentials.
        run: aws sts get-caller-identity --query Arn --output text

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (S3 backend)
        run: terraform -chdir="$TF_WORKING_DIR" init

  # ===========================================================================
  # Job 2: validate
  # Static checks only. It needs no AWS credentials, so it initialises Terraform
  # without the backend (providers and modules are still downloaded).
  # ===========================================================================
  validate:
    name: 2 - Terraform Validate
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (same commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.init.outputs.sha }}
          persist-credentials: false

      - name: Verify workflow commit SHA
        env:
          EXPECTED_SHA: ${{ needs.init.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] \
            || { echo "::error::commit mismatch between jobs"; exit 1; }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (no backend)
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir="$TF_WORKING_DIR" fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir="$TF_WORKING_DIR" validate

  # ===========================================================================
  # Job 3: plan
  # Produces the saved plan, runs the read-only existing-resource preflight, and
  # uploads the saved plan (UNENCRYPTED, 1-day retention) with its SHA-256 recorded.
  # ===========================================================================
  plan:
    name: 3 - Terraform Plan
    needs: [init, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_sha256: ${{ steps.checksum.outputs.plan_sha256 }}
      artifact_name: ${{ steps.checksum.outputs.artifact_name }}
    steps:
      - name: Checkout repository (same commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.init.outputs.sha }}
          persist-credentials: false

      - name: Verify workflow commit SHA
        id: commit
        env:
          EXPECTED_SHA: ${{ needs.init.outputs.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [ "$sha" = "$EXPECTED_SHA" ] && [ "$sha" = "$GITHUB_SHA" ] \
            || { echo "::error::commit mismatch between jobs"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        # Prints only the caller ARN, never credentials.
        run: aws sts get-caller-identity --query Arn --output text

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (S3 backend)
        run: terraform -chdir="$TF_WORKING_DIR" init

      - name: Terraform Plan
        id: plan
        run: |
          set -uo pipefail
          set +e # GitHub's default shell uses -e, which would abort on exit code 2 below
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
          terraform -chdir="$TF_WORKING_DIR" plan -no-color -detailed-exitcode -out=tfplan
          code=$?
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Infrastructure matches the configuration." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preflight - resources that already exist (read-only)
        # A create-only plan against an account where some of these resources already exist
        # (e.g. created by hand, or by an earlier run whose state was lost) would fail partway
        # or leave duplicates. This step only READS AWS. It never imports anything and never
        # touches Terraform state: on a conflict it fails the job so an administrator can decide.
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKING_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          trap 'rm -f "$RUNNER_TEMP/plan.json"' EXIT
          python3 -I .github/scripts/preflight_existing_resources.py "$RUNNER_TEMP/plan.json"

      - name: Checksum plan
        # The saved plan is uploaded UNENCRYPTED and can contain sensitive values in plain
        # text. Anyone who can read this repository's Actions artifacts can download it
        # during its 1-day retention. Only its SHA-256 is recorded, and the plan contents
        # are never printed.
        id: checksum
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          cd "$TF_WORKING_DIR"
          echo "plan_sha256=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=tfplan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.checksum.outputs.artifact_name }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1
          if-no-files-found: error

      - name: Remove local plan files
        if: always()
        run: rm -f "$TF_WORKING_DIR/tfplan" "$RUNNER_TEMP/plan.json"

  # ===========================================================================
  # Job 4: apply (manual approval)
  # `environment: production` makes GitHub hold this job until a required
  # reviewer approves; no step below runs before that. It runs only if every
  # earlier job succeeded, the plan has changes, and the run is on main. Before
  # applying it re-checks the saved plan (no deletes/replacements).
  # ===========================================================================
  apply:
    name: 4 - Terraform Apply
    needs: [init, validate, plan]
    if: >-
      success() &&
      needs.plan.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    env:
      PLAN_SHA: ${{ needs.plan.outputs.sha }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
      PLAN_ARTIFACT: ${{ needs.plan.outputs.artifact_name }}
    steps:
      - name: Checkout repository (same commit as the plan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Verify the plan and apply use the same commit
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PLAN_SHA" ] && [ "$PLAN_SHA" = "$GITHUB_SHA" ] \
            || { echo "::error::commit mismatch between plan and apply"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (S3 backend)
        run: terraform -chdir="$TF_WORKING_DIR" init

      - name: Download plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Verify plan checksum
        # The checksum comes from the plan job's output, so a swapped or altered
        # artifact is rejected before it is inspected or applied. The plan is not
        # encrypted and its contents are never printed.
        run: |
          set -euo pipefail
          cd "$TF_WORKING_DIR"
          echo "${PLAN_SHA256}  tfplan" | sha256sum --check --status \
            || { rm -f tfplan; echo "::error::plan artifact checksum mismatch"; exit 1; }

      - name: Delete guard (re-check the saved plan)
        # The apply job re-checks the exact file it is about to apply and refuses on any
        # delete/replace (the plan job no longer filters plans, so this is the guard).
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKING_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          deletes="$(python3 -I - "$RUNNER_TEMP/plan.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              plan = json.load(f)
          for rc in plan.get("resource_changes") or []:
              if "delete" in rc["change"]["actions"]:
                  print(rc["address"] + "  [" + "+".join(rc["change"]["actions"]) + "]")
          PY
          )"
          rm -f "$RUNNER_TEMP/plan.json"   # may contain sensitive values
          if [ -n "$deletes" ]; then
            echo "::error::the saved plan deletes or replaces resources; CI apply refused"
            echo "$deletes"
            rm -f "$TF_WORKING_DIR/tfplan"
            exit 1
          fi

      - name: Terraform Apply
        # Applies the saved plan exactly as approved. Terraform refuses it if the
        # state changed since the plan was made. No new plan is generated here.
        run: terraform -chdir="$TF_WORKING_DIR" apply -input=false -auto-approve tfplan

      - name: Terraform Outputs
        run: terraform -chdir="$TF_WORKING_DIR" output -no-color

      - name: Remove local plan files
        if: always()
        run: rm -f "$TF_WORKING_DIR/tfplan" "$RUNNER_TEMP/plan.json"
